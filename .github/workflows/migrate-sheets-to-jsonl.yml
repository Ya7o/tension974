name: Migrate Google Sheets history to data/*.jsonl

# One-off bridge for the GitHub Pages migration: pulls the historical
# observations/runs that used to live in Google Sheets into the repo as
# JSONL, so no data is lost when the Google Sheets storage backend is
# retired. Safe to re-run (it overwrites data/*.jsonl from the sheet, it
# does not touch the sheet itself) but only needed once.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth pyyaml python-dotenv

      - name: Migrate Google Sheets to data/*.jsonl
        run: python scripts/migrate_sheets_to_jsonl.py

      - name: Build GitHub Pages dashboard data
        run: python scripts/build_site_data.py

      - name: Commit and push migrated data
        run: |
          git config user.name "tension974-bot"
          git config user.email "tension974-bot@users.noreply.github.com"
          git add data/observations.jsonl data/runs.jsonl docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: migrate historical data from Google Sheets to jsonl"
            git push origin HEAD:${{ github.ref_name }}
          fi
