name: Scraping Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest

    env:
      DEBUG_SCRAPING: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Install curl-cffi (optional — TLS fingerprint spoofing)
        run: pip install curl-cffi || true

      - name: Run scraping diagnostics matrix
        run: python -m tension974.diagnostics.scraping_matrix

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraping-diagnostics-${{ github.run_id }}
          path: debug/
          retention-days: 14
