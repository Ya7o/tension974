      <details class="card foldable">
        <summary>Comment lire ces chiffres</summary>
        <div class="foldable-body">
          <ul>
            <li>La métrique suivie est le <strong>nombre total d'annonces</strong> affiché par Leboncoin pour chaque recherche enregistrée. Elle mesure le <em>stock visible d'offres</em>, pas la demande.</li>
            <li><strong>Peu d'annonces = marché tendu</strong> (offre rare). <strong>Beaucoup d'annonces = marché détendu</strong> (offre abondante, plus de concurrence entre bailleurs).</li>
            <li>Le niveau <em>Tendu / Normal / Détendu</em> situe le dernier relevé dans la distribution des <strong>12 derniers mois de la même recherche</strong> : jusqu'au 33ᵉ centile = tendu, à partir du 66ᵉ = détendu. Il faut au moins 8 relevés, sinon rien n'est affiché.</li>
            <li>Les prix <strong>médian et moyen</strong> sont calculés sur les <strong>30 premiers prix</strong> lus sur la page de résultats, pas sur l'ensemble des annonces. À lire comme un ordre de grandeur et une tendance, pas comme une valeur de marché exacte.</li>
            <li>Les trois recherches n'ont <strong>pas les mêmes filtres</strong> (rayon de 5 km, 1 km et 5 km ; planchers de prix différents). Comparer les <em>niveaux</em> d'une typologie à l'autre n'a pas de sens — seule l'évolution de chaque typologie dans le temps est comparable.</li>
            <li>La collecte tourne <strong>une fois par semaine</strong>, le jeudi soir.</li>
          </ul>
        </div>
      </details>
