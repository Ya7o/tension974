name: Repair observations sheet

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest

    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Repair observations rows
        run: |
          python - <<'PY'
          import json
          import os

          import gspread

          headers = [
              "search_id",
              "observed_at",
              "total_listings_count",
              "raw_total_listings_text",
              "median_price",
              "average_price",
              "price_sample_size",
              "min_price",
              "max_price",
              "status",
              "provider",
              "error_message",
              "credits_used",
              "created_at",
          ]

          service_account_json = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON")
          sheet_id = os.environ.get("GOOGLE_SHEET_ID")
          if not service_account_json:
              raise SystemExit("GOOGLE_SERVICE_ACCOUNT_JSON is missing")
          if not sheet_id:
              raise SystemExit("GOOGLE_SHEET_ID is missing")

          client = gspread.service_account_from_dict(json.loads(service_account_json))
          worksheet = client.open_by_key(sheet_id).worksheet("observations")
          values = worksheet.get_all_values()
          repaired = [headers]
          current_headers = values[0] if values else []

          for row in values[1:]:
              row = row + [""] * 20
              # Old SQLite sync rows had this shape:
              # id, search_id, observed_at, total_listings_count,
              # raw_total_listings_text, status, provider, error_message,
              # credits_used, created_at
              if row[0].isdigit() and row[1] in {
                  "studio_saint_denis",
                  "t2_t3_saint_denis",
                  "t3_saint_denis",
              }:
                  repaired.append([
                      row[1],
                      row[2],
                      row[3],
                      row[4],
                      "",
                      "",
                      "",
                      "",
                      "",
                      row[5],
                      row[6],
                      row[7],
                      row[8],
                      row[9],
                  ])
              elif current_headers and "median_price" not in current_headers:
                  # Rows already repaired before median_price existed:
                  # search_id, observed_at, total, raw, average, sample, min,
                  # max, status, provider, error, credits, created_at
                  repaired.append([
                      row[0],
                      row[1],
                      row[2],
                      row[3],
                      "",
                      row[4],
                      row[5],
                      row[6],
                      row[7],
                      row[8],
                      row[9],
                      row[10],
                      row[11],
                      row[12],
                  ])
              else:
                  fixed = row[:len(headers)]
                  # Some old no-price rows had created_at shifted into
                  # error_message and credits_used shifted into created_at.
                  if (
                      fixed[9] in {"success", "failed", "partial"}
                      and fixed[10]
                      and "T" in fixed[11]
                      and fixed[13].isdigit()
                  ):
                      fixed[11], fixed[12], fixed[13] = "", fixed[13], fixed[11]
                  repaired.append(fixed)

          worksheet.clear()
          worksheet.update(repaired, value_input_option="USER_ENTERED")
          print(f"Repaired observations rows: {len(repaired) - 1}")
          PY
